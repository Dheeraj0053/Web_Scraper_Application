services:
  # Backend Service
  - type: web
    name: insight-scraper-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
      - key: FRONTEND_URL
        sync: false # Set this manually in Render dashboard with your frontend URL

  # Frontend Service  
  - type: web
    name: insight-scraper-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        sync: false # Set this manually in Render dashboard with your backend URL (include /api at the end)
